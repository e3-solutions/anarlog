<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>E3 Scribe</title>
    <link rel="icon" type="image/svg+xml" href="/src-tauri/icons/e3/icon.svg" />
    <script src="/theme-boot.js"></script>
    <style>
      html,
      body,
      #root {
        background: transparent !important;
        background-color: transparent !important;
      }
      html[data-rounded-window] #boot-splash,
      html[data-rounded-window] #root {
        clip-path: inset(0 round 10px);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(270 40% 98%);
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body:has(#root:not(:empty)) #boot-splash {
        display: none;
      }
      html.dark #boot-splash {
        background: hsl(265 20% 11%);
      }
      .boot-splash-mark {
        position: relative;
        width: 4.5rem;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.1));
      }
      html.dark .boot-splash-mark {
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.45));
      }
      .boot-splash-mark svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .boot-splash-detail {
        max-width: 16rem;
        margin: 1.25rem 0 0;
        color: hsl(25 5% 45%);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 0.75rem;
        line-height: 1rem;
        text-align: center;
      }
      html.dark .boot-splash-detail {
        color: hsl(25 5% 55%);
      }
    </style>
    <script src="/relay-shim.js"></script>
  </head>
  <body spellcheck="false">
    <div id="boot-splash" data-tauri-drag-region aria-hidden="true">
      <div class="boot-splash-content">
        <div class="boot-splash-mark">
          <img
            src="/src-tauri/icons/e3/icon.svg"
            width="72"
            height="72"
            alt="E3 Scribe"
          />
        </div>
        <p class="boot-splash-detail">Loading your workspace…</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
