[package]
name = "anarlog-enterprise-control-plane"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
anarlog-enterprise-zoom-rtms-worker = { path = "../zoom-rtms-worker" }
anlg-api-auth.workspace = true
anlg-api-nango.workspace = true
anlg-http.workspace = true
anlg-meeting-capture.workspace = true
anlg-nango.workspace = true
anlg-session-ingest.workspace = true
anlg-shared-recording.workspace = true
owhisper-client.workspace = true
owhisper-interface.workspace = true

anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["json", "query", "tokio"] }
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
http.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "postgres", "sqlite", "runtime-tokio"] }
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { workspace = true, features = ["cors", "limit", "request-id", "trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url.workspace = true

[dev-dependencies]
anarlog-enterprise-google-meet-worker = { path = "../google-meet-worker" }
anlg-agent-access.workspace = true
anlg-db-app.workspace = true
anlg-db-core.workspace = true
anlg-session-ingest = { workspace = true, features = ["apply"] }
hmac.workspace = true
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
sha2-legacy = { package = "sha2", version = "0.10" }
tower = { workspace = true, features = ["util"] }
wiremock = "0.6"
