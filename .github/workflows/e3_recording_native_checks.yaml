name: E3 Recording Native Checks

on:
  pull_request:
    branches: [chore/shared-meeting-recordings]
    paths:
      - apps/desktop/**
      - crates/**
      - plugins/**
      - packages/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - rust-toolchain.toml
      - .cargo/config.toml
      - .github/workflows/e3_recording_native_checks.yaml
      - .github/actions/install_desktop_deps/**
      - .github/actions/rust_install/**
      - .github/actions/pnpm_install/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e3-recording-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.repository == 'e3-solutions/anarlog'
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      TAURI_ENV_TARGET_TRIPLE: aarch64-apple-darwin
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/install_desktop_deps # zizmor: ignore[self-repository] -- Validate the checked-out PR candidate with its owning dependency setup.
        with:
          target: macos
      - uses: ./.github/actions/rust_install # zizmor: ignore[self-repository] -- Match the candidate's pinned Rust toolchain.
        with:
          platform: macos
          cache-on-failure: true
      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: e3-recording-native-arm64-release-opt1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e3-recording-native-arm64-release-opt1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml') }}-
            e3-scribe-arm64-release-opt1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'Cargo.toml') }}-
      - uses: ./.github/actions/pnpm_install # zizmor: ignore[self-repository] -- Match the checked-out lockfile and package manager.
        id: pnpm
      - name: Configure macOS SDK
        run: |
          test "$(rustc -vV | awk '/^host:/ {print $2}')" = aarch64-apple-darwin
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Build shared UI
        run: pnpm -F @anlg/ui build
      - name: Test shared recording privacy and lifecycle
        run: |
          cargo test --locked --release --target aarch64-apple-darwin -p tauri-plugin-transcription -p tauri-plugin-analytics --features tauri-plugin-analytics/disable-analytics --lib shared_recording -- --test-threads=1
          cargo test --locked --release --target aarch64-apple-darwin -p tauri-plugin-transcription -p tauri-plugin-analytics --features tauri-plugin-analytics/disable-analytics --lib recording_diagnostics::tests -- --test-threads=1
      - run: cargo test --locked --release --target aarch64-apple-darwin -p tauri-plugin-updater2 --lib automatic::tests
      - name: Test native tray controls
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        run: pnpm exec cargo test --locked --release --target aarch64-apple-darwin -p tauri-plugin-anlg-tray -p tauri-plugin-analytics --features tauri-plugin-analytics/disable-analytics --lib -- --test-threads=1
      - name: Test listener lifecycle without audio devices
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        run: |
          cargo test --locked --release --target aarch64-apple-darwin -p listener-core --lib actors::root::tests -- --test-threads=1
          cargo test --locked --release --target aarch64-apple-darwin -p listener-core --lib actors::source::pipeline::tests -- --test-threads=1
          cargo test --locked --release --target aarch64-apple-darwin -p listener-core --lib actors::recorder::tests -- --test-threads=1
          cargo test --locked --release --target aarch64-apple-darwin -p listener-core --lib actors::listener::tests -- --test-threads=1
      - name: Generate transcription command bindings
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        run: |
          pnpm exec cargo test --locked --release --target aarch64-apple-darwin -p tauri-plugin-transcription -p tauri-plugin-analytics --features tauri-plugin-analytics/disable-analytics --lib test::export_types -- --exact
      - name: Upload generated command contracts
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e3-recording-native-generated-${{ github.sha }}
          path: |
            plugins/transcription/js/bindings.gen.ts
            plugins/transcription/permissions/autogenerated/
            plugins/transcription/permissions/schemas/schema.json
            plugins/tray/js/bindings.gen.ts
            plugins/tray/permissions/autogenerated/
            plugins/tray/permissions/schemas/schema.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify generated command contracts are committed
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        run: |
          generated_paths=(
            plugins/transcription/js/bindings.gen.ts
            plugins/transcription/permissions/autogenerated
            plugins/transcription/permissions/schemas/schema.json
            plugins/tray/js/bindings.gen.ts
            plugins/tray/permissions/autogenerated
            plugins/tray/permissions/schemas/schema.json
          )
          git diff --exit-code -- "${generated_paths[@]}"
          untracked=$(git ls-files --others --exclude-standard -- "${generated_paths[@]}")
          if [[ -n "$untracked" ]]; then
            echo "Generated command contracts contain uncommitted files:"
            printf '%s\n' "$untracked"
            exit 1
          fi
      - name: Save native check dependencies
        if: ${{ always() && steps.native-cache.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
