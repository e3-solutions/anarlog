name: E3 Scribe Mac Release

on:
  workflow_dispatch:
    inputs:
      defer_notarization:
        description: Build a signed diagnostic checkpoint for local notarization; never publish
        type: boolean
        default: false
  push:
    branches: [chore/shared-meeting-recordings]
    paths:
      - apps/desktop/**
      - crates/**
      - plugins/**
      - packages/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - rust-toolchain.toml
      - .github/workflows/e3_scribe_release.yaml
      - .github/actions/apple_cert/**
      - .github/actions/pnpm_install/**
      - .github/actions/install_desktop_deps/**
      - .github/actions/macos_notarize_dmg/**
      - scripts/notarize-dmg.mjs

permissions:
  contents: read

concurrency:
  group: e3-scribe-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'e3-solutions/anarlog' && github.ref == 'refs/heads/chore/shared-meeting-recordings'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      TAURI_ENV_TARGET_TRIPLE: aarch64-apple-darwin
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      DEFER_NOTARIZATION: ${{ inputs.defer_notarization || false }}
      NODE_OPTIONS: --max-old-space-size=4096
      APP_VERSION: 0.1.${{ github.run_number }}
      E3_APP_VERSION: 0.1.${{ github.run_number }}
      E3_RELEASE_VERSION: 0.1.${{ github.run_number }}
      E3_APP_IDENTIFIER: ${{ vars.E3_APP_IDENTIFIER }}
      E3_UPDATER_ENDPOINT: ${{ vars.E3_UPDATER_ENDPOINT }}
      E3_UPDATER_PUBLIC_KEY: ${{ vars.E3_UPDATER_PUBLIC_KEY }}
      VITE_API_URL: ${{ vars.ANARLOG_QA_API_URL }}
      VITE_APP_URL: ${{ vars.ANARLOG_QA_APP_URL }}
      VITE_SUPABASE_URL: ${{ vars.ANARLOG_QA_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.ANARLOG_QA_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
      - env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ inputs.defer_notarization != true && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.defer_notarization != true && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.E3_UPDATER_PRIVATE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E3_RELEASE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          required = (
              'APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'KEYCHAIN_PASSWORD',
              'APPLE_TEAM_ID', 'TAURI_SIGNING_PRIVATE_KEY',
              'E3_APP_IDENTIFIER', 'E3_UPDATER_ENDPOINT', 'E3_UPDATER_PUBLIC_KEY',
              'VITE_API_URL', 'VITE_APP_URL', 'VITE_SUPABASE_URL',
              'VITE_SUPABASE_ANON_KEY', 'SUPABASE_SERVICE_ROLE_KEY',
          )
          if os.environ['DEFER_NOTARIZATION'] != 'true':
              required += ('APPLE_ID', 'APPLE_PASSWORD')
          missing = [key for key in required if not os.environ.get(key, '').strip()]
          if missing:
              raise SystemExit('Missing release configuration: ' + ', '.join(missing))
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise SystemExit('Dispatch a fresh release; do not repeat notarization or overwrite an immutable version.')
          PY
      - id: apple-cert
        uses: ./.github/actions/apple_cert # zizmor: ignore[self-repository] -- Build the reviewed branch with its signing helper.
        with:
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - if: inputs.defer_notarization != true
        timeout-minutes: 2
        env:
          APPLE_ID: ${{ inputs.defer_notarization != true && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.defer_notarization != true && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/notarize-dmg.mjs --preflight
      - uses: ./.github/actions/install_desktop_deps # zizmor: ignore[self-repository] -- Use the checked-out native dependency setup.
        with:
          target: macos
      - run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target aarch64-apple-darwin
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: e3-scribe-arm64-release-opt1
          workspaces: . -> apps/desktop/src-tauri/target
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: ./.github/actions/pnpm_install # zizmor: ignore[self-repository] -- Match the checked-out lockfile and package manager.
      - run: pnpm -F @anlg/ui build
      - run: cargo xtask prepare-binaries
      - env:
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-cert.outputs.cert-id }}
        run: |
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp --options runtime crates/cloudsync/vendor/cloudsync/macos/aarch64/cloudsync.dylib
      - env:
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-cert.outputs.cert-id }}
          APPLE_ID: ${{ inputs.defer_notarization != true && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.defer_notarization != true && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.E3_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.E3_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$DEFER_NOTARIZATION" == "true" ]]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          node apps/desktop/scripts/build-e3.mjs --target aarch64-apple-darwin --features disable-analytics --bundles app,dmg --ci
      - id: package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bundle="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle"
          app="$bundle/macos/E3 Scribe.app"
          codesign --verify --deep --strict --verbose=2 -R "=anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\" and certificate leaf[field.1.2.840.113635.100.6.1.13] exists" "$app"
          if [[ "$DEFER_NOTARIZATION" != "true" ]]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          fi
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = "$E3_APP_IDENTIFIER"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$E3_APP_VERSION"
          shopt -s nullglob
          dmgs=("$bundle/dmg/"*.dmg)
          test "${#dmgs[@]}" = 1
          echo "dmg=${dmgs[0]}" >> "$GITHUB_OUTPUT"
      - if: inputs.defer_notarization != true
        uses: ./.github/actions/macos_notarize_dmg # zizmor: ignore[self-repository] -- Verify the outer installer with the existing notarization helper.
        timeout-minutes: 45
        with:
          dmg-path: ${{ steps.package.outputs.dmg }}
          signing-identity: ${{ steps.apple-cert.outputs.cert-id }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
      - env:
          DMG_PATH: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail
          mkdir -p e3-release
          cp "$DMG_PATH" e3-release/E3-Scribe-arm64.dmg
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos/E3 Scribe.app.tar.gz" e3-release/E3-Scribe.app.tar.gz
          cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle/macos/E3 Scribe.app.tar.gz.sig" e3-release/E3-Scribe.app.tar.gz.sig
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('e3-release/BUILD.json').write_text(json.dumps({
              'version': os.environ['E3_APP_VERSION'], 'sourceSHA': os.environ['GITHUB_SHA'],
              'bundleIdentifier': os.environ['E3_APP_IDENTIFIER'], 'target': 'aarch64-apple-darwin',
              'minimumMacOS': '15.0', 'signed': True, 'notarized': os.environ['DEFER_NOTARIZATION'] != 'true', 'updaterEnabled': True,
          }, indent=2) + '\n')
          Path(os.environ['RUNNER_TEMP'], 'e3-updater-verify.json').write_text(json.dumps({
              'plugins': {'updater': {'pubkey': os.environ['E3_UPDATER_PUBLIC_KEY']}}
          }))
          PY
          cargo run --locked --release --target aarch64-apple-darwin -p updater-core --bin verify-updater-signature -- e3-release/E3-Scribe.app.tar.gz e3-release/E3-Scribe.app.tar.gz.sig "$RUNNER_TEMP/e3-updater-verify.json"
          (cd e3-release && shasum -a 256 E3-Scribe-arm64.dmg E3-Scribe.app.tar.gz E3-Scribe.app.tar.gz.sig BUILD.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e3-scribe-${{ inputs.defer_notarization && 'signed-NOT-NOTARIZED' || 'macos' }}-${{ env.E3_APP_VERSION }}-${{ github.sha }}
          path: e3-release/
          if-no-files-found: error
          retention-days: 30
      - if: inputs.defer_notarization != true
        env:
          SUPABASE_URL: ${{ vars.ANARLOG_QA_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E3_RELEASE_SUPABASE_SERVICE_ROLE_KEY }}
          E3_RELEASE_BUCKET: ${{ vars.E3_RELEASE_BUCKET }}
        run: node apps/desktop/scripts/publish-e3.mjs e3-release
