name: E3 Meeting Capture Pilot

on:
  workflow_dispatch:
    inputs:
      native_checks_only:
        description: Run native checks without signing or packaging
        type: boolean
        default: false
      defer_notarization:
        description: Produce only a signed NOT NOTARIZED diagnostic checkpoint for local notarization
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e3-capture-pilot-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'e3-solutions/anarlog'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      TAURI_ENV_TARGET_TRIPLE: aarch64-apple-darwin
      CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_API_URL: http://localhost:3001
    steps:
      - id: signing-preflight
        if: inputs.native_checks_only != true
        env:
          DEFER_NOTARIZATION: ${{ inputs.defer_notarization }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ inputs.defer_notarization != true && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.defer_notarization != true && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          deferred = os.environ.get("DEFER_NOTARIZATION") == "true"
          required = ("APPLE_CERTIFICATE", "APPLE_CERTIFICATE_PASSWORD", "KEYCHAIN_PASSWORD", "APPLE_TEAM_ID")
          if not deferred:
              required += ("APPLE_ID", "APPLE_PASSWORD")
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              sys.exit("Missing signing secrets: " + ", ".join(missing))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
      - if: inputs.native_checks_only != true
        uses: ./.github/actions/apple_cert # zizmor: ignore[self-repository] -- Validate the signing identity before dependency installation or compilation.
        id: apple-cert
        with:
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - id: notarization-preflight
        if: inputs.native_checks_only != true && inputs.defer_notarization != true
        timeout-minutes: 2
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/notarize-dmg.mjs --preflight
      - uses: ./.github/actions/install_desktop_deps # zizmor: ignore[self-repository] -- Build helpers must match the checked-out candidate, including PR merge commits.
        with:
          target: macos
      - uses: ./.github/actions/rust_install # zizmor: ignore[self-repository] -- Use the checked-out candidate's toolchain setup.
        with:
          platform: macos
      - id: native-format
        name: Validate native formatting before caching
        run: rustfmt --check --edition 2024 plugins/permissions/src/ext.rs crates/detect/src/meeting_ax.rs
      - name: Cache native desktop build dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Separate full workspace caches from the old registry-only entry.
          # Match the pilot optimization below; Rust-cache hashes Cargo.lock/toolchain.
          # Manual builds use their branch cache and can restore default-branch entries.
          prefix-key: e3-pilot-native-v3-opt1
          workspaces: . -> apps/desktop/src-tauri/target
          # Validation must not occupy the immutable full-build cache key.
          save-if: ${{ inputs.native_checks_only != true }}
          # Preserve compiled dependencies even if Apple's later notarization fails.
          cache-on-failure: ${{ steps.native-format.outcome == 'success' }}
          cache-workspace-crates: true
      - uses: ./.github/actions/pnpm_install # zizmor: ignore[self-repository] -- Use the checked-out candidate's workspace setup.
      - run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - run: cargo test --locked -p detect browser_inspection
      - run: cargo test --locked -p detect browser_activation
      - run: cargo test --locked -p bundle proc::tests::
      - run: cargo test --locked -p detect chrome_tabs
      - run: cargo test --locked -p detect slack_
      - name: Validate native permission repairs before packaging
        run: |
          cargo test --locked -p tauri-plugin-permissions --features private-tcc --lib tests::
      - name: Generate detect bindings with the owning exporter
        run: |
          pnpm exec prettier --version
          pnpm exec cargo test --locked -p tauri-plugin-detect --lib test::export_types -- --exact
          pnpm exec prettier --check plugins/detect/js/bindings.gen.ts
      - name: Upload generated detect bindings
        if: inputs.native_checks_only != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e3-detect-bindings-${{ github.sha }}
          path: plugins/detect/js/bindings.gen.ts
          retention-days: 7
          if-no-files-found: error
      - run: pnpm -F ui build
      - run: cargo test --locked -p storage
      - if: inputs.native_checks_only != true
        run: cargo xtask prepare-binaries
      - if: inputs.native_checks_only != true
        env:
          SIGNING_IDENTITY: ${{ steps.apple-cert.outputs.cert-id }}
        run: |
          set -euo pipefail
          cloudsync_dylib="crates/cloudsync/vendor/cloudsync/macos/aarch64/cloudsync.dylib"
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime "$cloudsync_dylib"
          codesign --verify --strict --verbose=2 "$cloudsync_dylib"
      - id: build-pilot
        if: inputs.native_checks_only != true
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
          SIGNING_IDENTITY: ${{ steps.apple-cert.outputs.cert-id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          identity = os.environ["SIGNING_IDENTITY"]
          if not identity.startswith("Developer ID Application:"):
              raise SystemExit("A Developer ID Application signing identity is required")
          config = {"bundle": {"macOS": {"signingIdentity": identity, "hardenedRuntime": True}}}
          Path(os.environ["RUNNER_TEMP"], "e3-pilot-signing.json").write_text(json.dumps(config))
          PY
          # Submit separately after preserving the signed app, so an Apple queue
          # delay cannot discard a completed native build.
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          pnpm -F desktop tauri build \
            --target aarch64-apple-darwin \
            --config src-tauri/tauri.e3-pilot.json \
            --config "$RUNNER_TEMP/e3-pilot-signing.json" \
            --bundles app
      - id: checkpoint-signed-pilot
        if: inputs.native_checks_only != true
        env:
          BUILD_COMMIT: ${{ github.sha }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/E3 Meeting Capture Pilot.app"
          codesign --verify --deep --strict --verbose=2 -R "=anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\" and certificate leaf[field.1.2.840.113635.100.6.1.13] exists" "$app"
          mkdir -p pilot-signed-checkpoint
          ditto -c -k --sequesterRsrc --keepParent "$app" pilot-signed-checkpoint/E3-Meeting-Capture-Pilot-arm64.zip
          shasum -a 256 pilot-signed-checkpoint/E3-Meeting-Capture-Pilot-arm64.zip > pilot-signed-checkpoint/SHA256SUMS
          printf 'Commit: %s\nSigning: Developer ID signed; NOT NOTARIZED\nDiagnostic checkpoint only. Apple acceptance, stapling and Gatekeeper verification are pending. Do not treat this as the final installation artifact.\n' "$BUILD_COMMIT" > pilot-signed-checkpoint/BUILD.txt
      - if: inputs.native_checks_only != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e3-pilot-signed-NOT-NOTARIZED-${{ github.sha }}
          path: pilot-signed-checkpoint/
          if-no-files-found: error
          retention-days: 7
      - id: notarize-pilot
        if: inputs.native_checks_only != true && inputs.defer_notarization != true
        timeout-minutes: 45
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { notarizeDmg } from './scripts/notarize-dmg.mjs';
          if (process.env.GITHUB_RUN_ATTEMPT !== '1') {
            throw new Error('Do not resubmit after an unknown outcome; resume the saved submission ID with notarytool instead.');
          }
          const archive = 'pilot-signed-checkpoint/E3-Meeting-Capture-Pilot-arm64.zip';
          await notarizeDmg({ dmgPath: archive, log(message) {
            console.log(message);
            const prefix = 'Apple notarization submission: ';
            if (message.startsWith(prefix)) writeFileSync('pilot-notary-submission.json', JSON.stringify({
              submissionId: message.slice(prefix.length), commit: process.env.GITHUB_SHA,
              zipSha256: createHash('sha256').update(readFileSync(archive)).digest('hex'),
            }, null, 2));
          }});
          JS
          xcrun stapler staple "apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/E3 Meeting Capture Pilot.app"
      - if: always() && inputs.native_checks_only != true && inputs.defer_notarization != true && steps.checkpoint-signed-pilot.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e3-pilot-notary-submission-${{ github.sha }}
          path: pilot-notary-submission.json
          if-no-files-found: warn
          retention-days: 14
      - id: archive-pilot
        if: inputs.native_checks_only != true && inputs.defer_notarization != true
        shell: bash
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          app="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/E3 Meeting Capture Pilot.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          mkdir -p pilot-artifact
          ditto -c -k --sequesterRsrc --keepParent "$app" pilot-artifact/E3-Meeting-Capture-Pilot-arm64.zip
          shasum -a 256 pilot-artifact/E3-Meeting-Capture-Pilot-arm64.zip > pilot-artifact/SHA256SUMS
          printf 'Commit: %s\nTarget: aarch64-apple-darwin\nRequires: macOS 15 or later on Apple Silicon\nSigning: Developer ID Application; Apple-notarized and stapled\nBundle identifier: ai.e3group.meeting-capture-pilot\nRust optimization: level 1 for pilot iteration\nAutomatic updates: disabled\n' "$BUILD_COMMIT" > pilot-artifact/BUILD.txt
          printf '%s\n' "Download this Actions artifact, unzip E3-Meeting-Capture-Pilot-arm64.zip, and move the app to Applications. This build is Developer ID signed and notarized. Grant first-run microphone, system-audio, and Accessibility permissions." 'Keep the same bundle identifier and Apple Developer team for later signed builds. Changing developer teams or the bundle identifier can require granting macOS permissions again. Quit the app before replacing it; automatic updates are disabled.' 'Enable meeting capture explicitly in app settings. See apps/desktop/E3_RELEASE.md at the recorded commit for setup and manual tests. Google account connectors require a separately configured API; this artifact does not provision a backend.' > pilot-artifact/INSTALL.txt
      - if: inputs.native_checks_only != true && inputs.defer_notarization != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e3-meeting-capture-pilot-arm64-${{ github.sha }}
          path: pilot-artifact/
          if-no-files-found: error
          retention-days: 14
