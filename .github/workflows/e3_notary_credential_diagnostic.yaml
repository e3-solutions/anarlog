name: E3 notarization credential format diagnostic

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: e3-notary-credential-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'e3-solutions/anarlog' && github.ref == 'refs/heads/chore/shared-meeting-recordings'
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          raw = os.environ.get('APPLE_PASSWORD', '')
          trimmed = raw.strip()
          quoted = len(trimmed) >= 2 and trimmed[0] == trimmed[-1] and trimmed[0] in ('"', "'")
          normalized = trimmed[1:-1].strip() if quoted else trimmed
          pattern = r'[a-z]{4}(?:-[a-z]{4}){3}'
          report = {
              'passwordHasOuterWhitespace': raw != trimmed,
              'passwordHasOuterQuotes': quoted,
              'passwordLooksLikeAppleAppSpecificPassword': bool(re.fullmatch(pattern, raw)),
              'normalizedLooksLikeAppleAppSpecificPassword': bool(re.fullmatch(pattern, normalized)),
              'normalizationChangesValue': normalized != raw,
              'normalizedAuthenticationAttempted': False,
              'normalizedAuthenticationSucceeded': False,
          }
          if normalized != raw and re.fullmatch(pattern, normalized):
              report['normalizedAuthenticationAttempted'] = True
              try:
                  result = subprocess.run([
                      'xcrun', 'notarytool', 'history', '--apple-id', os.environ.get('APPLE_ID', ''),
                      '--password', normalized, '--team-id', os.environ.get('APPLE_TEAM_ID', ''),
                      '--output-format', 'json', '--no-progress',
                  ], capture_output=True, text=True, timeout=90)
                  report['normalizedAuthenticationSucceeded'] = result.returncode == 0 and isinstance(json.loads(result.stdout).get('history'), list)
              except (subprocess.TimeoutExpired, ValueError, AttributeError):
                  pass
          print(json.dumps(report))
          PY
