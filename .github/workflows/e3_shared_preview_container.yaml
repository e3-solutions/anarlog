name: E3 Shared Preview Container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e3-shared-preview-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'e3-solutions/anarlog' && github.ref == 'refs/heads/chore/shared-meeting-recordings'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --tag e3-shared-preview:verify --file enterprise/control-plane/preview-hosting/Dockerfile .
      - run: bash enterprise/control-plane/preview-hosting/smoke.sh e3-shared-preview:verify
